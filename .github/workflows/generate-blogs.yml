name: Generate AI Blog & Deploy

on:
  schedule:
    - cron: '0 4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate blog with Gemini
        run: node scripts/generate-blog.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and push new content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blogs/
          if git diff --cached --quiet; then
            echo "No new blog generated."
          else
            git commit -m "chore: auto-publish AI blog post"
            git push
          fi

      - name: Build static site
        run: npm run build

      - name: Deploy to Netlify
        continue-on-error: true
        run: npx --yes netlify-cli@latest deploy --prod --dir out --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
